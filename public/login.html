<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Katarinas 50-årsjubileum · Logga in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="stack-lg" style="padding-top: 4rem">
      <div class="brand" style="justify-content: center">
        <img src="/mark.svg" alt="" />
        <div class="brand-copy">
          <span class="brand-title">Katarinas 50-årsjubileum</span>
          <span class="brand-kicker">Värdsida</span>
        </div>
      </div>
      <section class="card stack">
        <h1>Logga in</h1>
        <p class="muted">Värdsidan är lösenordsskyddad. Gästlänken är oförändrad.</p>
        <p id="login-error" class="error hidden">Fel användarnamn eller lösenord.</p>
        <form class="stack" method="post" action="/login">
          <label class="field">
            <span class="field-label">Användarnamn</span>
            <input name="username" type="text" autocomplete="username" required />
          </label>
          <label class="field">
            <span class="field-label">Lösenord</span>
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary" type="submit">Logga in</button>
        </form>
      </section>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("error")) {
        document.querySelector("#login-error").classList.remove("hidden");
      }
    </script>
  </body>
</html>
